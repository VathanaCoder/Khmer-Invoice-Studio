<!DOCTYPE html>
<!-- Hallmark · macrostructure: tool-first (list → sheet → paper) · theme: paper-ledger · genre: modern-minimal
     pre-emit critique: P4 H4 E4 S4 R5 V4 · slop test: pass -->
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>វិក័យប័ត្រ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M18 12h28v40l-5-4-4.5 4-4.5-4-4.5 4-4.5-4-5 4z' fill='%23fff'/%3E%3Cpath d='M25 24h14M25 31h14M25 38h8' stroke='%232563eb' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="home">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16"/><path class="a" d="M18 12h28v40l-5-4-4.5 4-4.5-4-4.5 4-4.5-4-5 4z"/><path class="b" d="M25 24h14M25 31h14M25 38h8" fill="none" stroke-width="3.5" stroke-linecap="round"/></svg>
    <div><h1>វិក័យប័ត្រ</h1><p>Invoice calculator</p></div>
  </div>
  <button class="btn wide" id="create">Create</button>
  <section class="saved"><h2>Saved</h2><div id="list" style="display:grid;gap:10px"></div></section>
</main>

<div id="editor" hidden>
  <div class="bar" id="bar">
    <button id="back">Back</button>
    <div class="grp"><button id="edit">Edit</button><button id="save">Save</button><button id="dl" class="dl">Download</button></div>
  </div>
  <div class="stage">
    <div class="paper" id="paper"></div>
    <button class="add" id="addrow">+ Row</button>
  </div>
</div>

<div id="layer"></div>

<script src="script.js"></script>
</body>
</html>
