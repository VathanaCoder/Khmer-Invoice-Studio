<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2459bd"><title>Khmer Invoice Studio</title>
<style>
:root{--c:#2459bd;--soft:#eaf0ff}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font-family:system-ui,"Noto Sans Khmer",sans-serif}.app{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce3ef;border-radius:18px;padding:18px;box-shadow:0 10px 30px #233c6810;margin-bottom:14px}h1{font-size:22px;margin:0 0 8px}.muted{color:#71809a;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}label{font-size:12px;color:#71809a;font-weight:700}input,select{width:100%;padding:11px;border:1px solid #dce3ef;border-radius:10px;font:inherit;min-width:0}input[type=color]{height:44px;padding:4px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;background:var(--soft);color:var(--c)}.primary{background:var(--c);color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.paper{position:relative;background:white;border:1px solid #ccd5e3;padding:20px;overflow:hidden}.paperhead{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--c);padding-bottom:12px;margin-bottom:14px}.title{background:var(--c);color:white;padding:12px;font-size:22px;font-weight:800;overflow-wrap:anywhere}.meta{text-align:right;font-size:12px;color:#63738c}.meta input{border:0;border-bottom:1px dashed #9aa9bd;padding:3px;text-align:right;font-size:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}th{background:var(--c);color:white;padding:9px 3px}td{border:1px solid #b9c5d6;padding:4px 3px;text-align:center}th:nth-child(1){width:8%}th:nth-child(2){width:40%}th:nth-child(3){width:15%}th:nth-child(4){width:18%}th:nth-child(5){width:19%}td input,td textarea{border:0;background:transparent;border-radius:4px;padding:6px 2px;text-align:center;font:inherit;width:100%;min-height:34px}td textarea{text-align:left;resize:none;overflow:hidden;line-height:1.4}.total{margin-left:auto;width:min(100%,270px);border:1px solid #b9c5d6;padding:12px;display:flex;justify-content:space-between;font-weight:800}.watermark{position:absolute;top:45%;left:0;width:100%;text-align:center;color:var(--c);opacity:.09;font-size:48px;font-weight:900;transform:rotate(-18deg);pointer-events:none;overflow-wrap:anywhere}.saved{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #dce3ef;border-radius:10px;margin-top:8px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:12px}.paper{padding:10px}th{font-size:11px}td input,td textarea{font-size:12px;padding:4px 1px}}
</style></head><body><main class="app"><div class="head"><div><b>INVOICE STUDIO</b><div class="muted">KHMER • SIMPLE • PREMIUM</div></div><span class="muted">OFFLINE READY</span></div>
<section id="home" class="card"><h1 id="homeTitle">បង្កើតវិក្កយបត្រ</h1><p class="muted" id="homeSub">រៀបចំវិក្កយបត្រផ្ទាល់ខ្លួនរបស់អ្នក</p><div class="grid">
<div class="field"><label id="typeLabel">ប្រភេទ / Type</label><input id="type" value="វិក្កយបត្រ"></div><div class="field"><label id="dateLabel">កាលបរិច្ឆេទ / Date</label><input id="date" type="date"></div>
<div class="field"><label id="colorLabel">ពណ៌ / Color</label><input id="color" type="color" value="#2459bd"></div><div class="field"><label id="langLabel">ភាសា / Language</label><select id="lang"><option value="km">ខ្មែរ (Khmer)</option><option value="en">English</option></select></div>
<div class="field full"><label>Watermark</label><div style="display:flex;gap:8px"><input id="waterOn" type="checkbox" style="width:20px"><input id="waterText" placeholder="Watermark text" disabled></div></div></div><div class="actions"><button class="btn primary" id="create">＋ បង្កើត</button></div><div id="saved"></div></section>
<section id="editor" class="card hidden"><div class="head"><div><h1 id="editorTitle">វិក្កយបត្រ</h1><span class="muted">Invoice editor</span></div><div class="actions" style="margin:0"><button class="btn" id="back">← Back</button><button class="btn" id="edit">Edit</button><button class="btn" id="save">Save</button><button class="btn primary" id="download">↓ PNG</button></div></div>
<div class="paper" id="paper"><div id="watermark" class="watermark hidden"></div><div class="paperhead"><div id="paperTitle" class="title">វិក្កយបត្រ</div><div class="meta"><span id="dateCaption">កាលបរិច្ឆេទ</span><br><input id="paperDate" type="date"><br><span id="noCaption">លេខ</span> <input id="number" value="001" style="width:90px"></div></div>
<div class="tablewrap"><table><thead><tr><th id="hNo">ល.រ</th><th id="hItem">ឈ្មោះទំនិញ</th><th id="hQty">ចំនួន</th><th><span id="hPrice">តម្លៃ</span> <button id="currency" class="btn" style="padding:2px 5px">៛</button></th><th id="hTotal">សរុប</th></tr></thead><tbody id="rows"></tbody></table></div><div class="total"><span id="grandLabel">សរុបរួម</span><span id="grand">0 ៛</span></div><p class="muted" id="thanks">សូមអរគុណ!</p></div>
<div class="actions"><button class="btn" id="add">＋ បន្ថែមទំនិញ</button><button class="btn" id="clear">Clear items</button></div><p class="muted" id="hint">ចំនួន × តម្លៃ = សរុប</p></section></main>
<script>
const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('date').value=today();
let cfg={},rows=[],cur='៛',id=null,dirty=false;const words={km:{home:'បង្កើតវិក្កយបត្រ',sub:'រៀបចំវិក្កយបត្រផ្ទាល់ខ្លួនរបស់អ្នក',create:'＋ បង្កើត',back:'← ត្រឡប់',edit:'កែប្រែ',save:'រក្សាទុក',download:'↓ ទាញយក PNG',add:'＋ បន្ថែមទំនិញ',no:'ល.រ',item:'ឈ្មោះទំនិញ',qty:'ចំនួន',price:'តម្លៃ',total:'សរុប',grand:'សរុបរួម',date:'កាលបរិច្ឆេទ',thanks:'សូមអរគុណ!'},en:{home:'Create invoice',sub:'Create your own invoice',create:'＋ Create',back:'← Back',edit:'Edit',save:'Save',download:'↓ Download PNG',add:'＋ Add item',no:'No.',item:'Item name',qty:'Quantity',price:'Price',total:'Total',grand:'Grand total',date:'Date',thanks:'Thank you!'}};
function w(){return words[cfg.lang||$('lang').value]}function theme(){document.documentElement.style.setProperty('--c',cfg.color);document.documentElement.style.setProperty('--soft',cfg.color+'20')}
function translate(){let t=w();$('homeTitle').textContent=t.home;$('homeSub').textContent=t.sub;$('create').textContent=t.create;$('back').textContent=t.back;$('edit').textContent=t.edit;$('save').textContent=t.save;$('download').textContent=t.download;$('add').textContent=t.add;$('hNo').textContent=t.no;$('hItem').textContent=t.item;$('hQty').textContent=t.qty;$('hPrice').textContent=t.price;$('hTotal').textContent=t.total;$('grandLabel').textContent=t.grand;$('dateCaption').textContent=t.date;$('noCaption').textContent=t.no;$('thanks').textContent=t.thanks;$('editorTitle').textContent=cfg.type;$('paperTitle').textContent=cfg.type;render()}
function create(){cfg={type:$('type').value||'វិក្កយបត្រ',date:$('date').value||today(),color:$('color').value,lang:$('lang').value,waterOn:$('waterOn').checked,waterText:$('waterText').value};rows=[];cur='៛';id=null;$('number').value=Date.now().toString().slice(-6);$('paperDate').value=cfg.date;theme();$('currency').textContent=cur;$('watermark').textContent=cfg.waterText;$('watermark').classList.toggle('hidden',!cfg.waterOn);translate();showEditor()}
function showEditor(){ $('home').classList.add('hidden');$('editor').classList.remove('hidden');dirty=false;window.scrollTo(0,0)}
function showHome(){ $('editor').classList.add('hidden');$('home').classList.remove('hidden');list();window.scrollTo(0,0)}
function addRow(r={name:'',qty:'1',price:''}){rows.push({...r});dirty=true;render()}
function render(){let body=$('rows');body.innerHTML='';rows.forEach((r,i)=>{let tr=document.createElement('tr');let no=document.createElement('td');no.textContent=i+1;let nm=document.createElement('td'),name=document.createElement('textarea');name.rows=1;name.placeholder=w().item;name.value=r.name;name.oninput=()=>{r.name=name.value;name.style.height='auto';name.style.height=name.scrollHeight+'px';dirty=true};nm.append(name);let q=numberInput(r,'qty'),p=numberInput(r,'price'),tot=document.createElement('td');tot.dataset.total='';tr.append(no,nm,cell(q),cell(p),tot);body.append(tr);name.style.height='auto';name.style.height=name.scrollHeight+'px'});calc()}
function cell(x){let td=document.createElement('td');td.append(x);return td}function numberInput(r,k){let x=document.createElement('input');x.type='number';x.inputMode='decimal';x.min='0';x.step='any';x.value=r[k];x.oninput=()=>{r[k]=x.value;dirty=true;calc()};return x}
function fmt(n){return new Intl.NumberFormat(cfg.lang==='en'?'en-US':'km-KH',{maximumFractionDigits:2}).format(n)+' '+cur}function calc(){let sum=0;[...$('rows').children].forEach((tr,i)=>{let n=(+rows[i].qty||0)*(+rows[i].price||0);sum+=n;tr.querySelector('[data-total]').textContent=fmt(n)});$('grand').textContent=fmt(sum)}
$('create').onclick=create;$('waterOn').onchange=()=>$('waterText').disabled=!$('waterOn').checked;$('add').onclick=()=>addRow();$('clear').onclick=()=>{if(confirm('Clear all items?')){rows=[];dirty=true;render()}};$('currency').onclick=()=>{cur=cur==='៛'?'$':'៛';$('currency').textContent=cur;calc();dirty=true};
function save(){let rec={id:id||String(Date.now()),cfg,rows,cur,no:$('number').value};let a=JSON.parse(localStorage.invoiceStudio||'[]'),i=a.findIndex(x=>x.id===rec.id);if(i<0)a.unshift(rec);else a[i]=rec;localStorage.invoiceStudio=JSON.stringify(a);id=rec.id;dirty=false;list();alert('Saved on this device')}
$('save').onclick=save;$('back').onclick=()=>{if(dirty){let c=prompt('Type SAVE, EXIT, or CANCEL');if(!c||c.toUpperCase()==='CANCEL')return;if(c.toUpperCase()==='SAVE')save();else if(c.toUpperCase()!=='EXIT')return}showHome()};
$('edit').onclick=()=>{ $('editor').classList.add('hidden');$('home').classList.remove('hidden');$('type').value=cfg.type;$('date').value=cfg.date;$('color').value=cfg.color;$('lang').value=cfg.lang;$('waterOn').checked=cfg.waterOn;$('waterText').value=cfg.waterText;$('waterText').disabled=!cfg.waterOn};
function list(){let box=$('saved');box.innerHTML='';JSON.parse(localStorage.invoiceStudio||'[]').forEach(r=>{let d=document.createElement('div');d.className='saved';let s=document.createElement('span');s.textContent=r.cfg.type+' • '+r.cfg.date;let b=document.createElement('button');b.className='btn';b.textContent='Open';b.onclick=()=>{cfg=r.cfg;rows=r.rows;cur=r.cur;id=r.id;theme();$('number').value=r.no;$('paperDate').value=cfg.date;$('currency').textContent=cur;$('watermark').textContent=cfg.waterText;$('watermark').classList.toggle('hidden',!cfg.waterOn);translate();showEditor()};d.append(s,b);box.append(d)})}
$('download').onclick=()=>{let paper=$('paper'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),W=1200,H=430+rows.length*85;canvas.width=W;canvas.height=H;ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.fillStyle=cfg.color;ctx.fillRect(45,35,480,85);ctx.fillStyle='white';ctx.font='bold 36px sans-serif';ctx.fillText(cfg.type,65,90);ctx.fillStyle='#445';ctx.font='24px sans-serif';ctx.textAlign='right';ctx.fillText(cfg.date+'   #'+$('number').value,1150,85);let y=160;let xs=[45,140,650,820,985,1155];ctx.fillStyle=cfg.color;ctx.fillRect(45,y,1110,55);ctx.fillStyle='white';ctx.font='bold 22px sans-serif';ctx.textAlign='center';[w().no,w().item,w().qty,w().price,w().total].forEach((t,i)=>ctx.fillText(t,(xs[i]+xs[i+1])/2,y+36));y+=55;let sum=0;rows.forEach((r,i)=>{let total=(+r.qty||0)*(+r.price||0);sum+=total;ctx.strokeStyle='#aab';ctx.strokeRect(45,y,1110,80);ctx.fillStyle='#17243b';ctx.font='22px sans-serif';[i+1,r.name,r.qty,r.price,fmt(total)].forEach((t,j)=>ctx.fillText(String(t),(xs[j]+xs[j+1])/2,y+45));y+=80});ctx.textAlign='right';ctx.font='bold 27px sans-serif';ctx.fillText(w().grand+': '+fmt(sum),1150,y+55);if(cfg.waterOn&&cfg.waterText){ctx.save();ctx.globalAlpha=.12;ctx.translate(600,H/2);ctx.rotate(-.25);ctx.textAlign='center';ctx.font='bold 65px sans-serif';ctx.fillText(cfg.waterText,0,0);ctx.restore()}let a=document.createElement('a');a.download=(cfg.type||'invoice').replace(/[^\w-]/g,'_')+'.png';a.href=canvas.toDataURL('image/png');a.click()};
list();
</script></body></html>
